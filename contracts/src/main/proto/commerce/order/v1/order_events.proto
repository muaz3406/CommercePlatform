syntax = "proto3";

package commerce.order.v1;

import "commerce/common/v1/common.proto";
import "google/protobuf/timestamp.proto";

option java_multiple_files = true;
option java_package = "com.commerce.contracts.order.v1";
option java_outer_classname = "OrderEventsProto";

message OrderPlaced {
  string event_id = 1;
  string order_id = 2;
  string customer_id = 3;
  repeated OrderLine lines = 4;
  commerce.common.v1.Money total = 5;
  google.protobuf.Timestamp occurred_at = 6;
  int32 schema_version = 7;
}

message OrderLine {
  string offer_id = 1;
  int32 quantity = 2;
  commerce.common.v1.Money unit_price = 3;
}
