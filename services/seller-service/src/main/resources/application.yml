spring:
  application:
    name: seller-service
  datasource:
    url: ${SELLER_DB_URL:jdbc:postgresql://localhost:5432/commerce}
    username: ${SELLER_DB_USERNAME:commerce}
    password: ${SELLER_DB_PASSWORD:local-postgres-change-me}
  flyway:
    enabled: true
    schemas: seller
    default-schema: seller
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: seller
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/commerce}
          jwk-set-uri: ${KEYCLOAK_JWKS_URI:http://localhost:8080/realms/commerce/protocol/openid-connect/certs}

server:
  port: 8082
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

grpc:
  clients:
    catalog:
      address: ${CATALOG_GRPC_ADDRESS:localhost:9091}
      tls:
        client-certificate: ${CATALOG_GRPC_CLIENT_CERTIFICATE:}
        private-key: ${CATALOG_GRPC_CLIENT_PRIVATE_KEY:}
        trusted-ca-certificate: ${CATALOG_GRPC_TRUSTED_CA_CERTIFICATE:}
