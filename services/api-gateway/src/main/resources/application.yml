spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: catalog-service
              uri: ${CATALOG_SERVICE_URI:http://localhost:8081}
              predicates:
                - Path=/api/v1/products,/api/v1/products/**
            - id: seller-service
              uri: ${SELLER_SERVICE_URI:http://localhost:8082}
              predicates:
                - Path=/api/v1/seller/offers,/api/v1/seller/offers/**

server:
  port: 8088
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
