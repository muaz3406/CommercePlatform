spring:
  application:
    name: catalog-service
  mongodb:
    uri: ${MONGODB_URI:mongodb://localhost:27017/catalog}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/commerce}
          jwk-set-uri: ${KEYCLOAK_JWKS_URI:http://localhost:8080/realms/commerce/protocol/openid-connect/certs}

server:
  port: 8081
  shutdown: graceful

grpc:
  server:
    enabled: false
    port: 9091
    tls:
      certificate-chain: ${GRPC_TLS_CERTIFICATE_CHAIN:}
      private-key: ${GRPC_TLS_PRIVATE_KEY:}
      client-ca-certificate: ${GRPC_TLS_CLIENT_CA_CERTIFICATE:}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
